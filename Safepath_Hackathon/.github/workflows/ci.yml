name: SafePathAI CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'fix/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ==============================================================================
  # 1. SECURITY & CONFIG AUDIT
  # ==============================================================================
  security-audit:
    name: Security & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt --strict

      - name: Run Security and Redaction Scanner
        env:
          AUTH_SECRET: safepath_ci_secret_placeholder_for_docker_compose_32chars
        run: |
          python scripts/security_and_redaction_check.py

  # ==============================================================================
  # 2. BACKEND TEST SUITE (FastAPI + PostGIS + Redis)
  # ==============================================================================
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: safepath_db
          POSTGRES_USER: safepath_user
          POSTGRES_PASSWORD: safepath_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safepath_user -d safepath_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install system dependencies for OpenCV and ONNX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Backend lint
        run: |
          pip install ruff==0.14.4
          ruff check backend/app scripts/production --select E9,F63,F7,F82

      - name: Compile Python application
        run: python -m compileall -q backend/app

      - name: Initialize PostGIS Tables and Seed Real Datasets
        env:
          DATABASE_URL: postgresql+asyncpg://safepath_user:safepath_password@localhost:5432/safepath_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: |
          python -m alembic upgrade head
          python -m scripts.import_vdms_cameras
          python -m scripts.import_historical_floods
          python -m scripts.assign_camera_districts_postgis

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://safepath_user:safepath_password@localhost:5432/safepath_db
          REDIS_URL: redis://localhost:6379/0
          OSRM_BASE_URL: http://localhost:5000
          TESTING: 'true'
        run: |
          pytest backend/tests/ -v --tb=short

  # ==============================================================================
  # 3. FRONTEND TYPE-CHECK, UNIT TESTS & BUILD (Next.js 14 Standalone)
  # ==============================================================================
  frontend-check:
    name: Frontend Type-check, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Frontend unit tests
        run: npm run test:unit

      - name: Run Next.js production build
        env:
          AUTH_SECRET: safepath_ci_secret_placeholder_for_build_32chars_key
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Install Chromium for browser contract tests
        run: npx playwright install --with-deps chromium

      - name: Prepare standalone browser server
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Browser contract tests (explicit fixtures, no external credentials)
        env:
          AUTH_SECRET: safepath_ci_secret_placeholder_for_build_32chars_key
          NEXTAUTH_SECRET: safepath_ci_secret_placeholder_for_build_32chars_key
          INTERNAL_BACKEND_URL: http://127.0.0.1:9
        run: npx playwright test e2e/ci-contracts.spec.ts

  # ==============================================================================
  # 4. DOCKER BUILD VALIDATION
  # ==============================================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [security-audit, backend-test, frontend-check]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          AUTH_SECRET: safepath_ci_secret_placeholder_for_docker_compose_32chars
        run: |
          docker compose config --quiet

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: safepath-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: safepath-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image (OS and language packages)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: safepath-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Scan frontend image (OS and language packages)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: safepath-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Log in to GHCR after tests and image scans
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          prefix="${IMAGE_PREFIX,,}"
          for component in backend frontend; do
            image="$prefix/$component:sha-$COMMIT_SHA"
            docker tag "safepath-$component:ci" "$image"
            docker push "$image"
            echo "$component: $(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_STEP_SUMMARY"
          done
