[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safepath-ai"
version = "0.1.0"
description = "SafePath backend and repository administration commands"
requires-python = ">=3.11"

[project.scripts]
safepath-import-cameras = "scripts.import_vdms_cameras:main"
safepath-import-floods = "scripts.import_historical_floods:main"
safepath-assign-districts = "scripts.assign_camera_districts_postgis:main"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
exclude = ["backend.tests*"]
