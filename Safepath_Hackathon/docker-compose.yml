name: safepath-hackathon

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: safepath-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: safepath_db
      POSTGRES_USER: safepath_user
      POSTGRES_PASSWORD: safepath_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepath_user -d safepath_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safepath-net

  redis:
    image: redis:7-alpine
    container_name: safepath-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - safepath-net

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    container_name: safepath-osrm
    restart: unless-stopped
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data:ro
      - ./scripts/osrm_healthcheck.sh:/opt/osrm_healthcheck.sh:ro
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    healthcheck:
      test: ["CMD", "bash", "/opt/osrm_healthcheck.sh"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 120s
    networks:
      - safepath-net

  osm-import:
    profiles: ["tools"]
    image: iboates/osm2pgsql@sha256:6548a1e2492e08fa0d5ce987d382ad57c4b21c8a94ff00017c6109770a061b79
    environment:
      PGHOST: postgis
      PGPORT: 5432
      PGUSER: safepath_user
      PGPASSWORD: safepath_password
    volumes:
      - ./data/osrm:/data:ro
      - ./scripts/osm_roads.lua:/style.lua:ro
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - safepath-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: safepath-backend:latest
    container_name: safepath-backend
    user: "${BACKEND_DEV_USER:-0:0}"
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://safepath_user:safepath_password@postgis:5432/safepath_db
      REDIS_URL: redis://redis:6379/0
      OSRM_BASE_URL: http://osrm:5000
      VEHICLE_MODEL_PATH: data/models/vgg16_ssd_hcmc.onnx
      YOLO_MODEL_PATH: data/models/vgg16_ssd_hcmc.onnx
      CAMERA_SCRAPE_INTERVAL_SEC: "4"
      CAMERA_REFRESH_TARGET_SEC: "600"
      CAMERA_IMAGE_TTL_SECONDS: "600"
      CAMERA_BATCH_SIZE: "16"
      CAMERA_MAX_CONCURRENCY: "8"
      CAMERA_PROXY_PROVIDER: ${CAMERA_PROXY_PROVIDER:-vietmap}
      CAMERA_PROXY_ENABLED: ${CAMERA_PROXY_ENABLED:-true}
      CAMERA_PROXY_CACHE_TTL_SECONDS: ${CAMERA_PROXY_CACHE_TTL_SECONDS:-20}
      CAMERA_PROXY_STALE_MAX_SECONDS: ${CAMERA_PROXY_STALE_MAX_SECONDS:-120}
      CAMERA_PROXY_MAX_CACHED_FRAMES: ${CAMERA_PROXY_MAX_CACHED_FRAMES:-32}
      CAMERA_PROXY_MAX_PENDING: ${CAMERA_PROXY_MAX_PENDING:-64}
      CAMERA_PROXY_MAX_PIXELS: ${CAMERA_PROXY_MAX_PIXELS:-4194304}
      CAMERA_PROXY_MAX_BYTES: ${CAMERA_PROXY_MAX_BYTES:-3000000}
      CAMERA_PROXY_MAX_CONCURRENCY: ${CAMERA_PROXY_MAX_CONCURRENCY:-4}
      CAMERA_PROXY_TIMEOUT_SECONDS: ${CAMERA_PROXY_TIMEOUT_SECONDS:-8}
      CAMERA_PROXY_FAILURE_BACKOFF_SECONDS: ${CAMERA_PROXY_FAILURE_BACKOFF_SECONDS:-60}
      CAMERA_PROXY_MIN_REQUEST_INTERVAL_SECONDS: ${CAMERA_PROXY_MIN_REQUEST_INTERVAL_SECONDS:-0.25}
      CAMERA_VIEW_AI_ENABLED: ${CAMERA_VIEW_AI_ENABLED:-true}
      CAMERA_VIEW_AI_TIMEOUT_SECONDS: ${CAMERA_VIEW_AI_TIMEOUT_SECONDS:-20}
      HYDROLOGY_BULLETIN_ENABLED: ${HYDROLOGY_BULLETIN_ENABLED:-true}
      HYDROLOGY_BULLETIN_POLL_SECONDS: ${HYDROLOGY_BULLETIN_POLL_SECONDS:-1800}
      HYDROLOGY_BULLETIN_TIMEOUT_SECONDS: ${HYDROLOGY_BULLETIN_TIMEOUT_SECONDS:-10}
      HYDROLOGY_BULLETIN_MAX_BYTES: ${HYDROLOGY_BULLETIN_MAX_BYTES:-3000000}
      HYDROLOGY_BULLETIN_MAX_AGE_HOURS: ${HYDROLOGY_BULLETIN_MAX_AGE_HOURS:-36}
      CAMERA_AI_MODE: ${CAMERA_AI_MODE:-route_only}
      ROUTE_CAMERA_AI_ENABLED: ${ROUTE_CAMERA_AI_ENABLED:-true}
      ROUTE_AI_MAX_CAMERAS: ${ROUTE_AI_MAX_CAMERAS:-4}
      ROUTE_AI_MAX_CONCURRENCY: ${ROUTE_AI_MAX_CONCURRENCY:-2}
      ROUTE_AI_TIMEOUT_SECONDS: ${ROUTE_AI_TIMEOUT_SECONDS:-8}
      ROUTE_AI_CACHE_TTL_SECONDS: ${ROUTE_AI_CACHE_TTL_SECONDS:-300}
      ROUTE_AI_MAX_FRAME_AGE_SECONDS: ${ROUTE_AI_MAX_FRAME_AGE_SECONDS:-120}
      CAMERA_INGESTION_PERMITTED: ${CAMERA_INGESTION_PERMITTED:-false}
      CAMERA_ALLOW_VIEW_ONLY: ${CAMERA_ALLOW_VIEW_ONLY:-true}
      CAMERA_ROUTING_EVIDENCE_PERMITTED: ${CAMERA_ROUTING_EVIDENCE_PERMITTED:-false}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      HERE_API_KEY: ${HERE_API_KEY:-}
      TRAFFIC_PROVIDER: ${TRAFFIC_PROVIDER:-auto}
      TRAFFIC_CACHE_TTL_SECONDS: ${TRAFFIC_CACHE_TTL_SECONDS:-180}
      TRAFFIC_REQUEST_TIMEOUT_SECONDS: ${TRAFFIC_REQUEST_TIMEOUT_SECONDS:-3.0}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend:/app/backend
      - ./data/osrm:/app/data/osrm:ro
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - safepath-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: safepath-frontend:latest
    container_name: safepath-frontend
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${FRONTEND_PORT:-3000}}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safepath-net

volumes:
  postgis_data:
    name: safepath_postgis_data
  redis_data:
    name: safepath_redis_data

networks:
  safepath-net:
    driver: bridge

